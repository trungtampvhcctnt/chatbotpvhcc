<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phiếu đánh giá — TTPVHCC Tây Nha Trang</title>
  <link rel="icon" href="logo-hcc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div class="band">
    <header class="wrap header">
      <a href="index.html" style="display:flex;align-items:center;gap:12px;min-width:0">
        <img src="logo-hcc.png" alt="Logo CCHC">
        <span>
          <strong>TRUNG TÂM PHỤC VỤ HÀNH CHÍNH CÔNG PHƯỜNG TÂY NHA TRANG</strong>
          <span>Hành chính phục vụ</span>
        </span>
      </a>
    </header>
  </div>
  <main class="narrow">
    <a class="back" href="index.html">← Trang chủ</a>
    <h1>Phiếu đánh giá — 10 quầy</h1>
    <p class="muted">1 — Không hài lòng · 2 — Hài lòng · 3 — Rất hài lòng</p>
    <form id="phieu-form">
      <div class="stack" id="quay"></div>
      <div class="grid3">
        <input name="fullname" placeholder="Họ tên" required>
        <input name="phone" placeholder="Số điện thoại" required>
        <input name="date" type="date">
      </div>
      <textarea name="note" rows="3" placeholder="Ý kiến (không bắt buộc)" style="margin-top:8px"></textarea>
      <button class="btn" type="submit" style="margin-top:12px">Lưu và gửi</button>
      <p id="phieu-msg" class="msg"></p>
    </form>
  </main>
  <script>
    var QUAY = [
      "Quầy số 1 - Thuế đất đai",
      "Quầy số 2 - Lĩnh vực Đất đai thẩm quyền Chi nhánh VPĐKĐĐ",
      "Quầy số 3 - Lĩnh vực đất đai thẩm quyền UBND cấp xã (Bộ Nông nghiệp & Môi trường)",
      "Quầy số 4 - Lĩnh vực Xây dựng thẩm quyền UBND cấp xã (Bộ Xây dựng)",
      "Quầy số 5 – Lĩnh vực Y tế, Giáo dục, Văn hóa, Nội vụ (Bộ Y tế; Bộ Giáo dục & đào tạo; Bộ Nội vụ; Bộ văn hóa)",
      "Quầy số 6 – Lĩnh vực Hộ tịch (Đăng ký kết hôn, Trích lục bản sao hộ tịch), Công thương, Phi địa giới hành chính (Bộ Tư pháp; Bộ Công thương)",
      "Quầy số 7 – Lĩnh vực Bảo trợ xã hội, người có công (Bộ Nội vụ, Bộ Y tế)",
      "Quầy số 8 – Lĩnh vực Hộ tịch (Xác nhận tình trạng hôn nhân, giám hộ) (Bộ tư pháp)",
      "Quầy số 9 – Lĩnh vực Hộ tịch (Đăng ký khai sinh, khai tử, cải chính hộ tịch)",
      "Quầy số 10 – Đăng ký kinh doanh (Bộ Tài chính)"
    ];
    var box = document.getElementById("quay");
    QUAY.forEach(function (name, i) {
      var fs = document.createElement("fieldset");
      var radios = [1, 2, 3].map(function (v) {
        return '<label><input type="radio" name="q' + i + '" value="' + v + '"> ' + v + "</label>";
      }).join("");
      fs.innerHTML = "<legend>" + (i + 1) + ". " + name + '</legend><div class="radios">' + radios + "</div>";
      box.appendChild(fs);
    });
    document.querySelector('input[name="date"]').value = new Date().toISOString().slice(0, 10);
  </script>
  <script src="chat-config.js"></script>
  <script src="site.js"></script>
</body>
</html>
