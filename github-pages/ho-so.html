<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu Tiến Độ Hồ Sơ Một Cửa - TTPVHCC Tây Nha Trang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <div class="bg-red-700 text-white text-xs py-1.5 px-4 shadow-sm">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="font-bold text-yellow-300">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</div>
      <div>Hotline Một cửa: <strong class="text-yellow-200">0258.3822.456</strong></div>
    </div>
  </div>

  <header class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <span class="text-2xl">🏛️</span>
        <div>
          <h1 class="text-sm sm:text-base font-extrabold text-slate-900">TTPVHCC TÂY NHA TRANG</h1>
          <p class="text-xs text-slate-500 font-medium">Hệ thống Tra cứu Hồ sơ Một cửa Điện tử</p>
        </div>
      </a>
      <a href="index.html" class="text-xs font-bold text-slate-600 hover:text-red-700 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition-colors">
        ← Về Trang chủ
      </a>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full space-y-6">
    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
      <div class="border-b border-slate-100 pb-4">
        <span class="text-xs font-bold text-blue-700 uppercase">TRA CỨU TRỰC TUYẾN</span>
        <h2 class="text-xl sm:text-2xl font-black text-slate-900 mt-1">Kiểm Tra Tiến Độ Giải Quyết Hồ Sơ</h2>
        <p class="text-xs text-slate-500">Mã mẫu thử nghiệm: <code class="font-mono bg-slate-100 px-1 py-0.5 rounded text-blue-600 font-bold">H74-260901-0028</code> hoặc <code class="font-mono bg-slate-100 px-1 py-0.5 rounded text-blue-600 font-bold">KH-00129-2026</code></p>
      </div>

      <div class="max-w-xl space-y-3">
        <div class="flex gap-2">
          <input id="code-input" type="text" placeholder="Nhập mã hồ sơ (ví dụ: H74-260901-0028)" class="flex-1 border border-slate-300 rounded-xl px-4 py-2.5 text-xs sm:text-sm font-mono uppercase focus:outline-none focus:ring-2 focus:ring-blue-500">
          <button onclick="doSearch()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm px-6 py-2.5 rounded-xl cursor-pointer">
            Tra cứu
          </button>
        </div>
      </div>

      <div id="result-box"></div>
    </div>
  </main>

  <script>
    const apps = [
      {
        code: "H74-260901-0028",
        applicant: "Nguyễn Văn Hùng",
        procedure: "Đăng ký biến động quyền sử dụng đất (Sang tên Sổ đỏ)",
        receivedDate: "20/09/2026",
        dueDate: "04/10/2026",
        step: "Cơ quan thuế xác định nghĩa vụ tài chính",
        status: "Đang xử lý - Chờ nộp thuế",
        officer: "Trần Thị Mai (Chi nhánh VPĐKĐĐ Tây Nha Trang)",
        note: "Đã có thông báo thuế. Quý khách vui lòng nộp thuế qua ngân hàng hoặc VNeID."
      },
      {
        code: "KH-00129-2026",
        applicant: "Lê Thị Thảo",
        procedure: "Cấp Giấy phép xây dựng mới nhà ở riêng lẻ",
        receivedDate: "15/09/2026",
        dueDate: "02/10/2026",
        step: "Phê duyệt ký Giấy phép xây dựng",
        status: "Đã có kết quả",
        officer: "Hoàng Minh Tuấn (Phòng QLĐT)",
        note: "Giấy phép đã được ký duyệt. Quý khách mang biên nhận đến Quầy 06 nhận kết quả."
      }
    ];

    function doSearch() {
      const code = document.getElementById('code-input').value.trim().toUpperCase();
      const res = document.getElementById('result-box');
      if (!code) return;

      const app = apps.find(a => a.code === code);
      if (app) {
        res.innerHTML = `
          <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 text-xs text-emerald-950 space-y-4">
            <div class="flex justify-between items-center border-b border-emerald-200 pb-3">
              <div>
                <span class="text-slate-500 block">Mã số hồ sơ:</span>
                <span class="text-base font-black font-mono text-emerald-900">\${app.code}</span>
              </div>
              <span class="bg-emerald-600 text-white font-bold px-3 py-1 rounded-full text-xs">\${app.status}</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-slate-800">
              <div><strong>Người nộp:</strong> \${app.applicant}</div>
              <div><strong>Thủ tục:</strong> \${app.procedure}</div>
              <div><strong>Ngày tiếp nhận:</strong> \${app.receivedDate}</div>
              <div><strong>Hẹn trả kết quả:</strong> <span class="text-red-700 font-bold">\${app.dueDate}</span></div>
              <div><strong>Cán bộ thụ lý:</strong> \${app.officer}</div>
              <div><strong>Bước hiện tại:</strong> \${app.step}</div>
            </div>
            <div class="bg-white p-3 rounded-xl border border-emerald-200 text-slate-600">
              💡 <strong>Ghi chú:</strong> \${app.note}
            </div>
          </div>
        `;
      } else {
        res.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-xs text-amber-900">
            Không tìm thấy hồ sơ với mã "<strong>\${code}</strong>". Vui lòng kiểm tra lại giấy tiếp nhận hoặc gọi hotline 0258.3822.456.
          </div>
        `;
      }
    }
  </script>
</body>
</html>
